<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VibeFlow</title>
    <style>
        body {
            font-family: system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .loader { 
            font-size: 4rem; 
            margin-bottom: 20px;
        }
        h1 { margin: 10px 0; }
        p { opacity: 0.9; margin: 5px 0; }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="loader">🎵</div>
    <h1>VibeFlow</h1>
    <div class="info">
        <p><strong>Open this link in the VibeFlow app</strong></p>
        <p>If you have the app installed, tap "Open in VibeFlow"</p>
    </div>
    <p id="song-info" style="margin-top: 20px;"></p>
    
    <script>
        // Just show what song it is, don't redirect
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const artist = params.get('artist');
        
        if (title && artist) {
            document.getElementById('song-info').innerHTML = 
                `<strong>${title}</strong><br>by ${artist}`;
        }
    </script>
</body>
</html>
