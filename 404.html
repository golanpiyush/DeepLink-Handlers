<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Opening VibeFlow...</title>
    <style>
        body {
            font-family: system-ui;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader { 
            font-size: 3rem; 
            animation: spin 2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); }}
    </style>
</head>
<body>
    <div class="loader">🎵</div>
    <script>
        // The Flutter app_links package will intercept this URL
        // We just need to ensure the URL stays the same
        setTimeout(() => {
            window.location.href = window.location.href;
        }, 100);
    </script>
</body>
</html>
