<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening VibeFlow...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        p {
            opacity: 0.9;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .song-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            backdrop-filter: blur(10px);
        }
        
        .song-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        
        .song-artist {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.5);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        .cta-button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .cta-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1 id="status">Opening in VibeFlow...</h1>
        <div class="spinner" id="spinner"></div>
        <p id="message">Preparing your music...</p>
        
        <div id="songInfo" class="song-info" style="display: none;">
            <div class="song-title" id="songTitle"></div>
            <div class="song-artist" id="songArtist"></div>
        </div>
        
        <div id="error" class="error" style="display: none;">
            <strong>⚠️ Something went wrong</strong>
            <p id="errorMessage" style="margin-top: 0.5rem;"></p>
        </div>
    </div>

    <script>
        // Parse the URL to extract song information
        function parseSongUrl() {
            const path = window.location.pathname;
            const params = new URLSearchParams(window.location.search);
            
            // Extract video ID from path: /DeepLink-Handlers/song/VIDEO_ID
            const pathParts = path.split('/');
            const songIndex = pathParts.indexOf('song');
            
            if (songIndex === -1 || songIndex >= pathParts.length - 1) {
                return null;
            }
            
            const videoId = pathParts[songIndex + 1];
            
            if (!videoId) {
                return null;
            }
            
            return {
                videoId: videoId,
                title: params.get('title') || 'Unknown Song',
                artist: params.get('artist') || 'Unknown Artist',
                thumb: params.get('thumb') || '',
                duration: params.get('duration') || ''
            };
        }
        
        // Build the deep link URL
        function buildDeepLink(songData) {
            // Try custom scheme first (for installed app)
            return `vibeflow://song/${songData.videoId}?title=${encodeURIComponent(songData.title)}&artist=${encodeURIComponent(songData.artist)}&thumb=${encodeURIComponent(songData.thumb)}&duration=${encodeURIComponent(songData.duration)}`;
        }
        
        // Display song info
        function displaySongInfo(songData) {
            document.getElementById('songTitle').textContent = songData.title;
            document.getElementById('songArtist').textContent = songData.artist;
            document.getElementById('songInfo').style.display = 'block';
        }
        
        // Show error
        function showError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Unable to Open';
            document.getElementById('message').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
        
        // Attempt to open the app
        function attemptAppOpen(deepLink) {
            console.log('🔗 Attempting to open:', deepLink);
            
            // For mobile devices
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                // Try to open the app
                window.location.href = deepLink;
                
                // Fallback message after 2 seconds if app didn't open
                setTimeout(() => {
                    document.getElementById('status').textContent = 'App Not Installed?';
                    document.getElementById('message').innerHTML = 
                        'Download VibeFlow to play this song<br><a href="#" class="cta-button" style="color: #667eea;">Get the App</a>';
                    document.getElementById('spinner').style.display = 'none';
                }, 2000);
            } else {
                // Desktop - just redirect
                window.location.href = deepLink;
                
                setTimeout(() => {
                    document.getElementById('status').textContent = 'Opening VibeFlow...';
                    document.getElementById('message').textContent = 
                        'If the app doesn\'t open, make sure VibeFlow is installed.';
                }, 1000);
            }
        }
        
        // Main execution
        try {
            console.log('📍 Current URL:', window.location.href);
            
            const songData = parseSongUrl();
            
            if (!songData) {
                showError('Invalid song link. The URL format is incorrect.');
                console.error('❌ Failed to parse song data from URL');
                return;
            }
            
            console.log('🎵 Parsed song data:', songData);
            
            // Display the song info
            displaySongInfo(songData);
            
            // Build deep link
            const deepLink = buildDeepLink(songData);
            console.log('🔗 Deep link:', deepLink);
            
            // Attempt to open after a brief delay
            setTimeout(() => {
                attemptAppOpen(deepLink);
            }, 500);
            
        } catch (error) {
            console.error('❌ Error:', error);
            showError('An unexpected error occurred: ' + error.message);
        }
    </script>
</body>
</html>
