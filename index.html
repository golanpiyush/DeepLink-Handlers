<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFlow - Music Streaming</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }
        p {
            font-size: 24px;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        .download-btn {
            display: inline-block;
            padding: 16px 32px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵</h1>
        <h1>VibeFlow</h1>
        <p>Stream music, share vibes</p>
        <a href="https://github.com/golanpiyush/vibeflow" class="download-btn">
            View on GitHub
        </a>
    </div>
</body>
</html>
